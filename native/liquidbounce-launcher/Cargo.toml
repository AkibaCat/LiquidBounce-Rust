[package]
name = "liquidbounce-launcher-egui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Compact LiquidBounce-style launcher for the Rust 26.3 preview"

[dependencies]
eframe = { version = "0.37", default-features = true }
rfd = { version = "0.18", default-features = true }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minecraft-auth = "=0.1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1", features = ["serde"] }
md5 = "0.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
